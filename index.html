<!DOCTYPE html>
<html lang="ml"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ശാസ്ത്രോത്സവം Winner Poster Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Cinzel:wght@700&family=Great+Vibes&family=Manrope:wght@600;800&family=Noto+Sans+Malayalam:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Manrope,'Noto Sans Malayalam',sans-serif;background:#f1f5f9;color:#1e293b}
header{background:#0a0a6e;color:#fff;padding:14px 18px;font-weight:800}
main{max-width:1100px;margin:auto;padding:16px;display:grid;gap:18px;grid-template-columns:1fr 1fr}
@media(max-width:820px){main{grid-template-columns:1fr}}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 1px 4px #0002}
label{display:block;font-size:13px;font-weight:800;margin:12px 0 4px}
input[type=text],select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;font-size:14px}
input[type=range]{width:100%}
canvas{width:100%;height:auto;border-radius:10px;display:block}
button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:10px;background:#059669;color:#fff;font:800 17px inherit;font-family:inherit;cursor:pointer}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.row label{font-weight:600;font-size:12px}
</style></head><body>
<header>ശാസ്ത്രോത്സവം 2026 · Winner Poster Maker · GHSS കാരക്കുന്ന്</header>
<main>
<section class="card">
<label>Student Photo / ഫോട്ടോ</label><input type="file" id="photo" accept="image/*">
<div class="row"><div><label>Zoom</label><input type="range" id="zoom" min="0.5" max="3" step="0.05" value="1"></div>
<div><label>Left / Right</label><input type="range" id="ox" min="-200" max="200" value="0"></div>
<div><label>Up / Down</label><input type="range" id="oy" min="-200" max="200" value="0"></div></div>
<label>Student Name</label><input type="text" id="name" value="ARSHAD KARAKUNNU" placeholder="E.g. AJMAL T P">
<label>School / സ്കൂൾ</label><input type="text" id="school" value="GHSS KARAKUNNU">
<label>Item / ഇനം</label><input type="text" id="item" value="STILL MODEL">
<label>Result / ഫലം</label><select id="result"><option>FIRST WITH A GRADE</option><option>SECOND WITH A GRADE</option><option>THIRD WITH A GRADE</option><option>FIRST</option><option>SECOND</option><option>THIRD</option><option>A GRADE</option><option>B GRADE</option></select>
</section>
<section class="card"><canvas id="c" width="1080" height="1350"></canvas>
<button id="dl">⬇ Download Poster (PNG)</button></section>
</main>

 function wrapFit(text,maxW,start,min,maxLines){

 // result / grade / item stacked under the photo (measured so nothing overlaps)
 function stack(text,cx,topY,maxW,maxH,startSize,color,font){
  let s=startSize,m;const f=s=>`${s}px ${font}`;
  for(;;){x.font=f(s);m=x.measureText(text);
   if(((m.actualBoundingBoxAscent+m.actualBoundingBoxDescent)<=maxH&&m.width<=maxW)||s<=14)break;s-=2}
  x.textBaseline='alphabetic';x.textAlign='center';x.fillStyle=color;
  x.fillText(text,cx,topY+m.actualBoundingBoxAscent);
  x.textBaseline='middle';
  return topY+m.actualBoundingBoxAscent+m.actualBoundingBoxDescent}
